<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Developer – Ocean Kraft Pop-Up Speed Analysis</title>
  <!-- include:head-meta -->
  <script src="/theme-init.js"></script>
  <script type="module" src="/src/app/developer-main.js"></script>
</head>
<body class="page">
  <!-- include:site-header -->

  <main class="dev-panel">
    <p class="dev-panel__mobile">Die Developer-Seite ist für Laptop/Desktop gemacht und <b>nicht für Mobile geeignet</b>. Bitte am Rechner öffnen.</p>

    <div class="dev-panel__toolbar">
      <button class="button button--primary dev-panel__copy" type="button">In Zwischenablage kopieren</button>
      <button class="button button--primary dev-panel__save" type="button">Als Referenz festlegen</button>
      <button class="button button--primary dev-panel__clear" type="button">Standard herstellen</button>
      <p class="dev-panel__model"></p>
    </div>

    <section class="camera-view">
      <video class="camera-view__video" autoplay playsinline muted></video>
      <canvas class="camera-view__overlay"></canvas>
      <p class="camera-view__status" role="status" hidden></p>
    </section>

    <section class="dev-panel__side">
      <p class="dev-panel__status" role="status" hidden></p>
      <table class="dev-panel__table">
        <thead>
          <tr>
            <th><span class="annotated-label" data-help="Name des Kriteriums in STANCE_CRITERIA (src/config.js), darunter die Bezeichnung. Zeile antippen: der Ist-Wert wird zum Soll.">Key</span></th>
            <th><span class="annotated-label" data-help="Wie du gerade stehst – live gemessen über die letzte Sekunde. Grün = perfekt, Gelb = noch ok, Rot = außerhalb. Gemessen wird im Stehen: seitlich zur Kamera, Blick zur Nose.">Ist</span></th>
            <th><span class="annotated-label" data-help="Dein persönlicher Wert. Gelenk oder Zeile antippen übernimmt den Ist-Wert, „Als Referenz festlegen“ speichert ihn. Ist ein Soll gesetzt, wird damit verglichen. Der Kreispfeil entfernt ihn. „–“ = kein Soll gesetzt.">Soll</span></th>
            <th><span class="annotated-label" data-help="Fester Wert aus src/config.js. Mit ihm wird verglichen, solange du kein Soll gesetzt hast.">Referenz</span></th>
            <th><span class="annotated-label" data-help="± perfekt / ± ok um den Vergleichswert: innerhalb ± perfekt gibt es 100 Punkte (grün), bis ± ok sinken die Punkte (gelb), darüber 0 (rot).">Spielraum</span></th>
            <th><span class="visually-hidden">Zurücksetzen</span></th>
          </tr>
        </thead>
        <tbody class="dev-panel__rows"></tbody>
      </table>
      <template class="dev-panel__row-template">
        <tr class="dev-panel__row">
          <td><span class="dev-panel__json"></span><span class="dev-panel__label"></span></td>
          <td class="dev-panel__current"></td>
          <td class="dev-panel__personal"></td>
          <td class="dev-panel__reference"></td>
          <td class="dev-panel__range"></td>
          <td>
            <button class="dev-panel__reset" type="button" aria-label="Soll entfernen – Referenz aus config.js gilt" title="Soll entfernen – Referenz aus config.js gilt" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
          </td>
        </tr>
      </template>
    </section>
  </main>
</body>
</html>
