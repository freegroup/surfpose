name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; a new push cancels the queued one (not the running one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache the large pose model (~50 MB) so it isn't re-downloaded on every push.
      # Keyed on package-lock.json so the cache resets when the model version changes.
      - name: Cache pose model
        uses: actions/cache@v4
        with:
          path: public/models
          key: pose-model-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run build
        env:
          BASE_URL: /surfpose/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
